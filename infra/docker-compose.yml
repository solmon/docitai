version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: docitai-postgres
    environment:
      POSTGRES_USER: docitai
      POSTGRES_PASSWORD: docitai-dev-password
      POSTGRES_DB: docitai_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - docitai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docitai -d docitai_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_duration=on"

  # MSSQL Server
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: docitai-mssql
    user: root
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "DocitaiDev@123"
      MSSQL_PID: "Developer"
      MSSQL_AGENT_ENABLED: "true"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - docitai-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'DocitaiDev@123' -Q 'SELECT 1' -C"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      - postgres

  # Tenant Management Service
  tenant-service:
    build:
      context: ..
      dockerfile: apps/tenant-service/Dockerfile
      target: production
    container_name: docitai-tenant-service
    environment:
      # Database configuration
      DB_DATABASE_URL: "postgresql://docitai:docitai-dev-password@postgres:5432/docitai_dev"
      DB_DATABASE_TYPE: "postgresql"
      DB_ECHO_SQL: "false"
      # Application configuration
      APP_ENVIRONMENT: "development"
      APP_DEBUG: "true"
      APP_LOG_LEVEL: "DEBUG"
      # Tracing (optional - enable for distributed tracing)
      OTEL_ENABLED: "false"
      OTEL_SERVICE_NAME: "tenant-service"
      OTEL_EXPORTER_ENDPOINT: "http://jaeger:4317"
      # JWT configuration
      JWT_SECRET_KEY: "change-this-secret-in-production"
      JWT_ALGORITHM: "HS256"
    ports:
      - "8000:8000"
    networks:
      - docitai-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Tenant Service - Development mode with hot reload
  tenant-service-dev:
    build:
      context: ..
      dockerfile: apps/tenant-service/Dockerfile
      target: development
    container_name: docitai-tenant-service-dev
    environment:
      DB_DATABASE_URL: "postgresql://docitai:docitai-dev-password@postgres:5432/docitai_dev"
      DB_DATABASE_TYPE: "postgresql"
      DB_ECHO_SQL: "true"
      APP_ENVIRONMENT: "development"
      APP_DEBUG: "true"
      APP_LOG_LEVEL: "DEBUG"
    ports:
      - "8001:8000"
    volumes:
      - ../apps/tenant-service/src:/app/apps/tenant-service/src:ro
      - ../libs:/app/libs:ro
    networks:
      - docitai-network
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dev

  # Jaeger for distributed tracing (optional)
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: docitai-jaeger
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14250:14250"
      - "14268:14268"
      - "14269:14269"
      - "4317:4317"
      - "4318:4318"
      - "9411:9411"
    networks:
      - docitai-network
    profiles:
      - tracing

  # PgAdmin for PostgreSQL Management (Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: docitai-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@docitai.local
      PGADMIN_DEFAULT_PASSWORD: admin-password
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    networks:
      - docitai-network
    depends_on:
      - postgres
    profiles:
      - admin

volumes:
  postgres_data:
    driver: local
  mssql_data:
    driver: local

networks:
  docitai-network:
    driver: bridge
