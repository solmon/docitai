[project]
name = "storage-adapter"
version = "0.1.0"
description = "Cloud storage provider abstraction layer supporting S3, Azure Blob, and Google Cloud Storage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5.0",
    "boto3>=1.34.0",
    "azure-storage-blob>=12.17.0",
    "google-cloud-storage>=2.14.0",
]

[tool.uv]
workspaces = ["../.."]
