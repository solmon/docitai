[project]
name = "database-core"
version = "0.1.0"
description = "Multi-database abstraction layer with TenantAwareBase model for Docitai DMS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlmodel>=0.0.14",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
]

[dependency-groups]
mssql = [
    "pyodbc>=5.0.0",
    "sqlalchemy[mssql]>=2.0.0",
]

postgres = [
    "psycopg2-binary>=2.9.0",
    "sqlalchemy[postgresql]>=2.0.0",
]
