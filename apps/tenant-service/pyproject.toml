[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenant-service"
version = "0.1.0"
description = "Tenant management microservice for Document Management System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "fastapi-core",
    "database-core",
    "storage-adapter",
    "tenant-auth",
    "compliance-engine",
    "sqlmodel>=0.0.14",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "uvicorn[standard]>=0.24.0",
    "python-dotenv>=1.0.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

mssql = [
    "pymssql>=2.3.0",
    "sqlalchemy[mssql]>=2.0.0",
]

postgres = [
    "psycopg2-binary>=2.9.0",
    "sqlalchemy[postgresql]>=2.0.0",
]

[tool.uv]
workspaces = ["../.."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"
